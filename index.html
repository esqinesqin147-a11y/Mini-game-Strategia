<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strategia v1.5 - Generals & Events</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --gold: #f59e0b; --sci: #3b82f6; --red: #ef4444; --green: #22c55e; --blue: #06b6d4; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
              #header { background: var(--card); padding: 10px; display: flex; justify-content: space-around; border-bottom: 2px solid #334155; font-size: 12px; }
        .stat span { color: var(--gold); font-size: 16px; display: block; text-align: center; }
        #event-box { height: 45px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--blue); border-bottom: 1px solid #334155; text-align: center; padding: 0 10px; }
                #mapContainer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; flex-grow: 1; overflow-y: auto; }
        .tile { aspect-ratio: 1; background: var(--card); border: 2px solid #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; transition: 0.2s; text-align: center; }
        .player { background: #064e3b; border-color: var(--green); }
        .enemy { background: #450a0a; border-color: var(--red); }
        .selected { border-color: white; transform: scale(1.05); z-index: 5; box-shadow: 0 0 10px white; }
                #controls { background: var(--card); padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-atk { background: var(--red); grid-column: span 2; font-size: 14px; }
