<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strategia v1.5 - Generals & Events</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --gold: #f59e0b; --sci: #3b82f6; --red: #ef4444; --green: #22c55e; --blue: #06b6d4; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
              #header { background: var(--card); padding: 10px; display: flex; justify-content: space-around; border-bottom: 2px solid #334155; font-size: 12px; }
        .stat span { color: var(--gold); font-size: 16px; display: block; text-align: center; }
        #event-box { height: 45px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--blue); border-bottom: 1px solid #334155; text-align: center; padding: 0 10px; }
                #mapContainer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; flex-grow: 1; overflow-y: auto; }
        .tile { aspect-ratio: 1; background: var(--card); border: 2px solid #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; transition: 0.2s; text-align: center; }
        .player { background: #064e3b; border-color: var(--green); }
        .enemy { background: #450a0a; border-color: var(--red); }
        .selected { border-color: white; transform: scale(1.05); z-index: 5; box-shadow: 0 0 10px white; }
                #controls { background: var(--card); padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-atk { background: var(--red); grid-column: span 2; font-size: 14px; }
                #menu { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .option-group { margin: 15px 0; width: 100%; max-width: 400px; }
        .sel-btn { padding: 10px; margin: 5px; background: #334155; border: 1px solid transparent; color: white; border-radius: 5px; width: 45%; }
        .active { border-color: var(--blue); background: #1e293b; box-shadow: 0 0 10px var(--blue); }
        h2 { color: var(--gold); margin-bottom: 5px; }
    </style>
</head>
 <body>
    <div id="menu">
        <h1 id="m-title">STRATEGIA v1.5</h1>
        <div class="option-group">
            <h2 id="m-lang">Dil / Language</h2>
            <button class="sel-btn active" onclick="setLang('az', this)">Azərbaycan</button>
            <button class="sel-btn" onclick="setLang('en', this)">English</button>
        </div>
               <div class="option-group">
            <h2 id="m-gen">General</h2>
            <button class="sel-btn active" onclick="setGen(0, this)" id="g0">İqtisadçı (+Qızıl)</button>
            <button class="sel-btn" onclick="setGen(1, this)" id="g1">Hərbçi (-Qiymət)</button>
            <button class="sel-btn" onclick="setGen(2, this)" id="g2">Alim (+Elm)</button>
        </div>
        <button onclick="start()" style="background:var(--green); padding: 15px 50px; font-size: 20px; margin-top: 20px;" id="m-start">BAŞLA</button>
    </div>
        <div id="header">
        <div class="stat"><span id="l-gold">Qızıl</span> <span id="gold">0</span></div>
        <div class="stat"><span id="l-inf">Piyada</span> <span id="inf">0</span></div>
        <div class="stat"><span id="l-tnk">Tank</span> <span id="tnk">0</span></div>
        <div class="stat"><span id="l-sci">Elm</span> <span id="sci">0</span></div>
    </div>
    <div id="event-box">...</div>
    <div id="mapContainer"></div>
        <div id="controls">
        <button onclick="buy(1)" id="b-inf">Piyada (30$)</button>
        <button onclick="buy(2)" id="b-tnk">Tank (150$)</button>
        <button onclick="upTech()" id="b-tech">Texnoloji (50💡)</button>
        <button onclick="buy(3)" id="b-plane" style="background:var(--blue)">Təyyarə (600$)</button>
        <button class="btn-atk" onclick="attack()" id="b-atk">HÜCUM ET</button>
        </div>
