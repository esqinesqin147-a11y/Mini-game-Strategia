<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategiya V1.3.2 - Silent Background</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .panel { background: #161b22; padding: 10px; border-radius: 12px; border: 1px solid #30363d; font-size: 13px; }
        .map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 350px; margin: 10px auto; }
        .province { aspect-ratio: 1/1; background: #21262d; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.3s; border: 2px solid transparent; }
        .player { background: #238636 !important; box-shadow: 0 0 10px #238636; border-color: #39d353; }
        .enemy { background: #da3633; border-color: #f85149; }
        #end-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; color: white; }
    </style>
</head>
<body>

    <div id="end-screen">
        <h1 id="end-title">OYUN BİTDİ</h1>
        <button onclick="location.reload()" style="width: 200px; background: white; color: black;">YENİDƏN BAŞLA</button>
    </div>

    <div class="stats-grid">
        <div class="panel" style="color:#f1c40f">💰 Qızıl: <span id="pGold">50</span></div>
        <div class="panel" style="color:#e94560">🏭 Düşmən Fab: <span id="eFact">0</span></div>
    </div>

    <div class="map" id="gameMap">
        <div id="p0" class="province player">PAYTAXT</div>
        <div id="p1" class="province enemy" onclick="attack(this)">E-1</div>
        <div id="p2" class="province enemy" onclick="attack(this)">E-2</div>
        <div id="p3" class="province enemy" onclick="attack(this)">E-3</div>
        <div id="p4" class="province enemy" onclick="attack(this)">E-4</div>
        <div id="p5" class="province enemy" onclick="attack(this)">E-5</div>
        <div id="p6" class="province enemy" onclick="attack(this)">E-6</div>
        <div id="p7" class="province enemy" onclick="attack(this)">E-7</div>
        <div id="p8" class="province enemy" onclick="attack(this)">E-8</div>
    </div>

    <button onclick="buyTroops()" style="background:#238636">⚔️ Əsgər Al (20 Q)</button>
    <button onclick="buyFactory()" style="background:#8957e5">🏭 Fabrik Qur (100 Q)</button>

    <script>
        // SƏS SİSTEMİ (Su səsi silindi)
        const aud = {
            march: new Audio('https://www.myinstants.com/media/sounds/army-marching.mp3'),
            build: new Audio('https://assets.mixkit.co/active_storage/sfx/1191/1191-preview.mp3'),
            coin: new Audio('https://assets.mixkit.co/active_storage/sfx/2001/2001-preview.mp3'),
            attack: new Audio('https://assets.mixkit.co/active_storage/sfx/1183/1183-preview.mp3'),
            loss: new Audio('https://assets.mixkit.co/active_storage/sfx/2504/2504-preview.mp3')
        };

        let pGold = 50, pTroops = 0, pFact = 0, eFact = 0, provinces = 1, isGameOver = false;

        function updateUI() {
            document.getElementById('pGold').innerText = Math.floor(pGold);
            document.getElementById('eFact').innerText = eFact;
        }

        setInterval(() => {
            if(isGameOver) return;
            pGold += (provinces * 2) + (pFact * 10);
            updateUI();
        }, 1000);

        function buyTroops() { 
            if(pGold >= 20) { 
                pGold -= 20; pTroops += 10; 
                aud.coin.play(); aud.march.play(); updateUI(); 
            } 
        }

        function buyFactory() { 
            if(pGold >= 100) { 
                pGold -= 100; pFact += 1; 
                aud.build.play(); updateUI(); 
            } 
        }

        function attack(el) {
            if (isGameOver || el.classList.contains('player')) return;
            let cost = 15 + (eFact * 4);
            if (pTroops >= cost) {
                pTroops -= cost; provinces++;
                el.classList.replace('enemy', 'player'); el.innerText = "SƏNİN";
                aud.attack.play(); aud.march.play();
                if (provinces === 9) endGame(true);
                updateUI();
            }
        }

        function endGame(win) {
            isGameOver = true;
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-title').innerText = win ? "QƏLƏBƏ!" : "MƏĞLUBİYYƏT!";
            if(!win) aud.loss.play();
        }

        setInterval(() => {
            if(isGameOver) return;
            if (Math.random() > 0.8 && eFact < 12) { eFact++; updateUI(); }
        }, 10000);

        function enemyAction() {
            if(isGameOver) return;
            setTimeout(() => {
                if (!isGameOver && Math.random() > 0.65 && provinces > 1) {
                    let targets = document.querySelectorAll('.player');
                    let t = targets[Math.floor(Math.random() * targets.length)];
                    t.classList.replace('player', 'enemy'); t.innerText = "DÜŞMƏN";
                    provinces--; aud.loss.play();
                    if (t.id === "p0") endGame(false);
                    updateUI();
                }
                enemyAction();
            }, 8000 - (eFact * 500));
        }
        enemyAction();
    </script>
</body>
  </html>
